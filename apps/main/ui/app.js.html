  /** 图标内部内容：收录的类别画 SVG，其他显示名称第一个字。 */
  function iconInner(name) {
    var inner = Object.prototype.hasOwnProperty.call(ICONS, name) ? ICONS[name] : null;
    if (!inner) return esc(String(name || '?').charAt(0));
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + inner + '</svg>';
  }
  function catIcon(name) { return '<span class="ci">' + iconInner(name) + '</span>'; }

  // ---------- 小黑猫头像（原创的简单几何图形，内嵌 SVG）：normal 普通 / happy 开心（眯眼 + 张嘴） ----------
  var CAT_INK = '#23252B', CAT_PINK = '#F4A6B8', CAT_MINT = '#5DCAA5';
  function catSvg(mood) {
    var happy = mood === 'happy';
    var eyes = happy
      ? '<path d="M19.5 34.5q4.5-5.5 9 0M35.5 34.5q4.5-5.5 9 0" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/>'
      : '<circle cx="24" cy="33" r="5.2" fill="#fff" stroke="#CDEBDD" stroke-width="1.4"/><circle cx="40" cy="33" r="5.2" fill="#fff" stroke="#CDEBDD" stroke-width="1.4"/>' +
        '<circle cx="24.6" cy="33.8" r="2.7" fill="' + CAT_INK + '"/><circle cx="40.6" cy="33.8" r="2.7" fill="' + CAT_INK + '"/>' +
        '<circle cx="25.7" cy="32.5" r=".9" fill="#fff"/><circle cx="41.7" cy="32.5" r=".9" fill="#fff"/>';
    var mouth = happy
      ? '<path d="M28.3 41.6q3.7 6.4 7.4 0z" fill="' + CAT_PINK + '" stroke="' + CAT_PINK + '" stroke-width="1.2" stroke-linejoin="round"/>'
      : '<path d="M29 42.2q1.5 1.6 3 0q1.5 1.6 3 0" fill="none" stroke="#DADDE0" stroke-width="1.3" stroke-linecap="round"/>';
    return '<svg class="cat" viewBox="0 0 64 64" aria-hidden="true" data-mood="' + (happy ? 'happy' : 'normal') + '">' +
      '<path d="M13 31L16.5 8.5 30 20.5zM51 31L47.5 8.5 34 20.5z" fill="' + CAT_INK + '" stroke="' + CAT_INK + '" stroke-width="3" stroke-linejoin="round"/>' +

      '<path d="M15 39.5l7 .8M15.5 43.5l6.6-1.4M49 39.5l-7 .8M48.5 43.5l-6.6-1.4" stroke="#6B6F78" stroke-width="1" stroke-linecap="round"/>' +
      '<path d="M23.5 47.5l7.5 3.7-7.5 3.8zM40.5 47.5L33 51.2l7.5 3.8z" fill="' + CAT_MINT + '" stroke="' + CAT_MINT + '" stroke-width="1.2" stroke-linejoin="round"/>' +
      '<circle cx="32" cy="51.2" r="2.6" fill="#3FA683"/></svg>';
  }
  function catAvatar(mood, cls) {
    return '<span class="cat-av' + (cls ? ' ' + cls : '') + '" data-mood="' + (mood === 'happy' ? 'happy' : 'normal') + '">' + catSvg(mood) + '</span>';
  }
  /** 小猫爪印（打卡章）：薄荷色 + 粉色肉垫 */
  var PAW_STAMP = '<svg class="paw" viewBox="0 0 32 32" aria-hidden="true"><g fill="#5DCAA5"><circle cx="8" cy="13" r="3.9"/><circle cx="13.3" cy="7.6" r="3.9"/>' +

    '<g fill="#F4A6B8"><circle cx="8" cy="13.3" r="2"/><circle cx="13.3" cy="7.9" r="2"/><circle cx="18.7" cy="7.9" r="2"/><circle cx="24" cy="13.3" r="2"/><ellipse cx="16" cy="20.8" rx="4.6" ry="3.4"/></g></svg>';

  // ---------- 小工具 ----------
  function api(name) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (resolve, reject) {
      var runner = google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);
      runner[name].apply(runner, args);
    });
  }
  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function money(cents) {
    if (cents === null || cents === undefined) return '—';
    var neg = cents < 0, abs = Math.abs(cents);
    var whole = String(Math.floor(abs / 100)).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    return (neg ? '-' : '') + '$' + whole + '.' + String(abs % 100).padStart(2, '0');
  }
  function pct(tenths) {
    return tenths === null || tenths === undefined ? '' : Math.floor(tenths / 10) + '.' + (tenths % 10) + '%';
  }
  function addMonths(month, delta) {
    var y = +month.slice(0, 4), mo = +month.slice(5, 7) - 1 + delta;
    y += Math.floor(mo / 12); mo = ((mo % 12) + 12) % 12;
    return y + '-' + String(mo + 1).padStart(2, '0');
  }
  function monthLabel(m) { return m.slice(0, 4) + ' 年 ' + (+m.slice(5, 7)) + ' 月'; }

  function toast(msg) {

    clearTimeout(toast._t); toast._t = setTimeout(function () { t.hidden = true; }, 2500);
  }
  function fail(err) { toast((err && err.message) || '出错了，请稍后再试'); }
  function categoriesOf(type, includeId) {

  // ---------- 页面切换 ----------
  var PAGES = ['entries', 'form', 'report', 'budget', 'settings'];
  var TITLES = { entries: '账目', form: '记一笔', report: '报表', budget: '预算', settings: '我的' };
  function show(page) {
    if (page !== 'form') {                       // 离开记一笔：收起抽屉，记住从哪一页来（“取消”回到那里）
      closeSheet(true);
      state.draft = null;
      state.lastPage = page;
    }
    if (rip.pending && !rip.inGo) clearRipple();   // 别处（取消、跳转）抢先切页：放弃还没落地的涟漪切换
    PAGES.forEach(function (p) { $('page-' + p).hidden = p !== page; });
    if (page !== 'budget') closeBudgetSheet();
    setNavActive(page);
    $('page-title').textContent = page === 'form' && state.editing ? '编辑' : TITLES[page];
    window.scrollTo(0, 0);
  }
  function setNavActive(page) {
    document.querySelectorAll('.bottomnav button').forEach(function (b) {
      b.classList.toggle('active', b.getAttribute('data-nav') === page);
    });
    placePill();
  }
  /** 导航高亮胶囊：滑到当前选中的标签（记一笔页时隐藏） */
  function placePill() {
    var pill = $('navpill'), cur = document.querySelector('.bottomnav .navitem.active');
    if (!pill) return;
    if (!cur || cur.classList.contains('navadd')) { pill.classList.remove('on'); return; }
    pill.style.width = cur.offsetWidth + 'px';
    pill.style.height = cur.offsetHeight + 'px';
    pill.style.top = cur.offsetTop + 'px';
    pill.style.transform = 'translateX(' + cur.offsetLeft + 'px)';
    pill.classList.add('on');
    if (!pill.classList.contains('ready')) setTimeout(function () { pill.classList.add('ready'); }, 30);   // 第一次摆放不做滑动
  }
  window.addEventListener('resize', placePill);

  // ---------- 音效（Web Audio 现场合成，无音频文件） ----------
  // S2 水滴“嘀”：切页；R3 上扬三音：保存成功。开关存在本机 localStorage('ledger.sound')，默认开；
  // 读写失败一律当作开。任何异常都静默忽略。测试可替换 sound.play 来观察。
  var SOUND_KEY = 'ledger.sound';
  var SOUNDS = {
    s2: { glide: [1400, 700], dur: 0.12, gain: 0.10 },
    r3: { notes: [{ f: 660, at: 0, dur: 0.15, gain: 0.11 }, { f: 880, at: 0.08, dur: 0.15, gain: 0.11 }, { f: 1175, at: 0.16, dur: 0.35, gain: 0.12 }] }
  };
  var audio = { ctx: null, session: false };
  function soundOn() {
    try { return window.localStorage.getItem(SOUND_KEY) !== 'off'; } catch (e) { return true; }
  }
  function setSoundOn(on) {
    try { window.localStorage.setItem(SOUND_KEY, on ? 'on' : 'off'); } catch (e) { /* 存不了就算了 */ }
  }
  function audioCtx() {
    if (audio.ctx) return audio.ctx;
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    if (!audio.session) {
      audio.session = true;
      try { if (navigator.audioSession) navigator.audioSession.type = 'ambient'; } catch (e) { /* 老版本没有 */ }
    }
    audio.ctx = new AC();
    return audio.ctx;
  }
  /** 一个音：sine，8ms 线性起音，指数衰减到 0.0001；freqs 为 [起, 止]（止可省略）。 */
  function tone(ctx, t0, freqs, dur, peak) {
    var osc = ctx.createOscillator(), g = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(freqs[0], t0);
    if (freqs[1]) osc.frequency.exponentialRampToValueAtTime(freqs[1], t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(peak, t0 + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(g); g.connect(ctx.destination);
    osc.start(t0); osc.stop(t0 + dur + 0.02);
  }
  function synth(name) {
    try {
      var ctx = audioCtx(), spec = SOUNDS[name];
      if (!ctx || !spec) return;
      if ((ctx.state === 'suspended' || ctx.state === 'interrupted') && ctx.resume) ctx.resume();
      var t = ctx.currentTime;
      if (spec.glide) tone(ctx, t, spec.glide, spec.dur, spec.gain);
      else spec.notes.forEach(function (n) { tone(ctx, t + n.at, [n.f], n.dur, n.gain); });
    } catch (e) { /* 没有 Web Audio 或出错：静默 */ }
  }
  // iOS 只允许在用户手势里启动音频：第一次点按/触摸时就建好 AudioContext、resume，并放一个静音小片段彻底解锁。
  // 之后保存成功（异步回调里，不在手势中）的 R3 才响得出来。不受开关影响（开关以后打开也立刻可响）。
  var UNLOCK_EVENTS = ['pointerdown', 'touchend', 'click', 'keydown'];
  function unlockAudio() {
    try {
      var ctx = audioCtx();
      if (!ctx) { removeUnlock(); return; }
      if (ctx.resume) ctx.resume();
      var src = ctx.createBufferSource();
      src.buffer = ctx.createBuffer(1, 1, 22050);
      src.connect(ctx.destination);
      src.start(0);
      if (ctx.state === 'running') removeUnlock();
    } catch (e) { removeUnlock(); }
  }
  function removeUnlock() {
    UNLOCK_EVENTS.forEach(function (ev) { document.removeEventListener(ev, unlockAudio, true); });
  }
  UNLOCK_EVENTS.forEach(function (ev) { document.addEventListener(ev, unlockAudio, { capture: true, passive: true }); });
  var sound = { play: synth, synth: synth, unlock: unlockAudio };
  function playSound(name) {
    if (!soundOn()) return;
    try { sound.play(name); } catch (e) { /* 静默 */ }
  }

  // ---------- 底部导航：薄荷涟漪切页 ----------
  // 点四个标签之一（且不是当前页）：先从被点的标签中心长出薄荷圆盖住内容区（约 260ms），
  // 圆盖满时才真正切页（show() 本身仍是同步的），新页淡入 + 轻微放大，涟漪淡出后移除。
  // 其他任何入口（记一笔、取消/保存、页内跳转、月份箭头）都不经过这里，所以没有涟漪。
  var RIPPLE = { grow: 260, enter: 220, fade: 240 };
  var rip = { pending: false, inGo: false, timers: [], el: null, enterEl: null };
  function clearRipple() {
    rip.timers.forEach(clearTimeout); rip.timers = [];
    if (rip.el && rip.el.parentNode) rip.el.parentNode.removeChild(rip.el);
    rip.el = null; rip.pending = false;
    if (rip.enterEl) { rip.enterEl.classList.remove('page-enter'); rip.enterEl = null; }
  }
  function visiblePage() {
    for (var i = 0; i < PAGES.length; i++) if (!$('page-' + PAGES[i]).hidden) return PAGES[i];
    return null;
  }
  function navTap(btn) {
    var page = btn.getAttribute('data-nav');
    var isTab = page === 'entries' || page === 'report' || page === 'budget' || page === 'settings';
    clearRipple();                                   // 连点：后一次为准，清掉前一次的涟漪
    if (!isTab || page === visiblePage()) { go(page); return; }
    playSound('s2');                                 // 真的要换页（涟漪与减少动态两条路都响一次）
    if (prefersReducedMotion()) { go(page); return; }
    var main = document.querySelector('main'), bar = document.querySelector('.topbar'), nav = document.querySelector('.bottomnav');
    var top = bar.getBoundingClientRect().bottom, bottom = nav.getBoundingClientRect().top;
    var W = window.innerWidth || document.documentElement.clientWidth || 360;
    var H = Math.max(bottom - top, 1);
    var b = btn.getBoundingClientRect();
    var cx = b.left + b.width / 2, cy = b.top + b.height / 2 - top;   // 相对内容区
    var r = Math.sqrt(Math.max(cx, W - cx) * Math.max(cx, W - cx) + Math.max(cy, H - cy) * Math.max(cy, H - cy));
    var clip = document.createElement('div');
    clip.className = 'ripple-clip';
    clip.style.top = top + 'px'; clip.style.height = H + 'px';
    var dot = document.createElement('div');
    dot.className = 'ripple-dot';
    dot.style.width = dot.style.height = (2 * r) + 'px';
    dot.style.left = (cx - r) + 'px'; dot.style.top = (cy - r) + 'px';
    clip.appendChild(dot);
    document.body.appendChild(clip);
    rip.el = clip; rip.pending = true;
    setNavActive(page);                              // 胶囊与高亮立刻开始滑动
    void dot.offsetWidth;                            // 触发一次布局，让 transition 生效
    clip.classList.add('grow');
    rip.timers.push(setTimeout(function () {
      rip.inGo = true;
      try { go(page); } finally { rip.inGo = false; }
      rip.pending = false;
      var pg = $('page-' + page);
      if (pg) { pg.classList.add('page-enter'); rip.enterEl = pg; }
      clip.classList.add('out');
      rip.timers.push(setTimeout(function () { if (pg) pg.classList.remove('page-enter'); if (rip.enterEl === pg) rip.enterEl = null; }, RIPPLE.enter + 40));
      rip.timers.push(setTimeout(function () { if (clip.parentNode) clip.parentNode.removeChild(clip); if (rip.el === clip) rip.el = null; }, RIPPLE.fade + 40));
    }, RIPPLE.grow));
  }
  function go(page) {
    if (page === 'entries') return loadEntries();
    if (page === 'form') { state.editing = null; return openForm(null); }
    if (page === 'report') return loadReportPage();
    if (page === 'budget') return loadBudget(state.budgetMonth || state.boot.current_month);
    if (page === 'settings') { state.meSub = null; return loadSettings(); }
  }

  // ---------- 账目页 ----------
  function loadEntries() {
    show('entries');
    return api('api_listMonth', state.month, state.filter).then(renderEntries).catch(fail);
  }
  function renderEntries(data) {
    var isCurrent = data.month === state.boot.current_month;
    var html = '<div class="hero"><div class="monthnav"><button data-act="prev" aria-label="上个月">‹</button><strong>' + monthLabel(data.month) +
      '</strong><button data-act="next" aria-label="下个月">›</button></div></div>';
    var t = data.totals;
    if (t) {
      html += '<div class="summary" id="month-summary"><div class="cols">' +
        '<div class="col"><div class="k">支出</div><div class="v expense" id="sum-expense">' + money(t.expense_cents) + '</div></div>' +
        '<div class="col"><div class="k">收入</div><div class="v income" id="sum-income">' + money(t.income_cents) + '</div></div>' +
        '<div class="col"><div class="k">结余</div><div class="v' + (t.diff_cents < 0 ? ' neg' : '') + '" id="sum-diff">' + money(t.diff_cents) + '</div></div></div>' +
        (t.pending_count > 0 ? '<div class="incomplete" id="sum-incomplete">统计不完整：有 ' + t.pending_count + ' 笔金额未补全</div>' : '') + '</div>';
    }
    html += '<div class="entries-body">';
    html += applePayAlertHtml() + gmailAlertHtml();
    var b = data.banner;
    if (b.pending + b.review > 0) {
      html += '<button class="banner" data-act="toggle-filter">' + (isCurrent ? '本月' : '这个月') + '有 ' + b.pending +
        ' 笔待补全、' + b.review + ' 笔待核对' + (state.filter === 'attention' ? '（点击显示全部）' : '（点击只看这些）') + '</button>';
    }
    // 其他月份还有待处理账目时的提示（只在“只看待处理”时显示）
    if (state.filter === 'attention' && data.attention_months) {
      var others = data.attention_months.filter(function (x) { return x.month !== data.month; });
      if (others.length) {
        var n = others.reduce(function (a, x) { return a + x.count; }, 0);
        var later = others.filter(function (x) { return x.month > data.month; });
        var nextM = (later.length ? later[0] : others[0]).month;
        html += '<div class="more-months" id="more-months">其他月份还有 ' + n + ' 笔 <button data-act="next-attention" data-month="' + esc(nextM) + '">下一个月份 ›</button></div>';
      }
    }
    if (!data.days.length) {
      html += state.filter === 'attention'
        ? '<div class="empty">没有需要处理的记录</div>'
        : '<div class="empty"><p>本月还没有记录</p><button class="primary" data-act="new">记一笔</button></div>';
    }
    data.days.forEach(function (day) {
      html += '<div class="day"><h3><span>' + dayLabel(day.date) + '</span><span>支出 ' + money(day.expense_subtotal_cents) + '</span></h3><div class="daycard">';
      day.entries.forEach(function (e) {
        var title = e.merchant || e.display_category_name || e.category_name;
        var tags = '';
        if (e.is_refund) tags += '<span class="tag">退款</span>';
        if (e.status === 'dup_review') tags += '<span class="tag">可能重复</span>';
        if (e.status === 'amount_review') tags += '<span class="tag">待核对金额</span>';
        var amount = e.amount_cents === null
          ? '<div class="amt ' + e.type + '">—</div><div class="pending-hint">无法识别金额，需要用户自行查看</div>'
          : '<div class="amt ' + e.type + '">' + (e.type === 'income' ? '+' : '') + money(e.amount_cents) + '</div>';
        html += '<button class="entry" data-act="edit" data-id="' + esc(e.id) + '">' + catIcon(e.category_name) + '<div class="main"><div class="title">' +
          esc(title) + tags + '</div><div class="sub">' + esc(e.display_category_name || e.category_name) +
          (e.source_name ? ' · ' + esc(e.source_name) : '') + ' · <span class="chan">' + esc(e.channel_label) +
          '</span></div></div><div>' + amount + '</div></button>';
      });
      html += '</div></div>';
    });
    $('page-entries').innerHTML = html + '</div>';
  }

  // ---------- 记一笔 / 编辑：第 1 步选类别（网格），第 2 步填金额（底部抽屉） ----------

  // ===== 数字键盘（纯函数，方便测试）：value 是当前输入的文字，key 是按下的键 =====
  var KEYPAD = { MAX_INT_DIGITS: 7, MAX_DECIMALS: 2 };   // 最大 9,999,999.99
  function keypadPress(value, key) {
    var v = String(value || '');
    var dot = v.indexOf('.');
    if (key === 'clear') return '';
    if (key === 'back') return v.slice(0, -1);
    if (key === '.') return dot >= 0 ? v : (v === '' ? '0' : v) + '.';
    if (key === '00') return v === '' || v === '0' ? v : keypadPress(keypadPress(v, '0'), '0');
    if (/^[0-9]$/.test(key)) {
      if (v === '0') return key;                                  // 0 后面再按数字：替换，不出现 05
      if (dot >= 0) return v.length - dot - 1 >= KEYPAD.MAX_DECIMALS ? v : v + key;
      return v.length >= KEYPAD.MAX_INT_DIGITS ? v : v + key;
    }
    return v;
  }
  function amountForServer(v) { return String(v || '').replace(/\.$/, ''); }   // “5.”按 5 提交
  function amountIsPositive(v) { return Number(amountForServer(v)) > 0; }

  function centsToText(cents) {     // 1250 -> "12.5"，1200 -> "12"
    var t = (Math.abs(cents) / 100).toFixed(2).replace(/0+$/, '').replace(/\.$/, '');
    return t;
  }
  function isTextField(el) {
    return !!(el && ((el.tagName === 'INPUT' && /^(text|datetime-local)$/.test(el.type || 'text')) || el.tagName === 'TEXTAREA'));
  }

  /** 草稿：面板里正在填写的全部内容。关闭面板回到网格时草稿保留。 */
  function newDraft(e, candidates) {
    var isManual = !e || e.channel === 'manual';
    return {
      id: e ? e.id : null,
      entry: e,
      isManual: isManual,
      type: e ? e.type : 'expense',
      amount: e && e.amount_cents !== null ? centsToText(e.amount_cents) : '',
      category_id: e ? e.category_id : '',
      is_refund: e ? !!e.is_refund : false,
      refund_of: e && e.refund_of ? e.refund_of : '',
      source_sel: e && e.income_source_id ? e.income_source_id : '',   // '' 不填 / 来源 id / '__new__' 新建
      new_source: '',
      local_datetime: e ? e.local_datetime : state.boot.now_local,
      merchant: e ? e.merchant : '',
      note: e ? e.note : '',
      pending_message_id: null,
      expanded: null,         // 当前展开的小标签：date / merchant / refund / source
      candidates: candidates || []
    };
  }
  function isRefundEntry(d) { return d.isManual ? d.is_refund : !!(d.entry && d.entry.is_refund); }
  function findCategory(id) {
    return state.boot.categories.filter(function (c) { return c.id === id; })[0] || null;
  }

  function openForm(id) {
    var load = id ? api('api_getEntry', id) : Promise.resolve(null);
    return Promise.all([load, api('api_refundCandidates')]).then(function (res) {
      var e = res[0];
      state.editing = e;
      state.draft = newDraft(e, res[1]);
      state.gridType = state.draft.type;
      show('form');
      renderFormPage();
      if (e) openSheet();     // 编辑：直接打开填好内容的面板
    }).catch(fail);
  }

  /** 数字键盘按钮（记一笔和预算共用）：keyAct 是按键的 data-act，doneHtml 是右下角“完成”按钮。 */
  function keypadHtml(keyAct, doneHtml) {
    var keys = ['1', '2', '3', 'back', '4', '5', '6', 'clear', '7', '8', '9'];
    function key(k, label, cls, extra) {
      return '<button class="key' + (cls ? ' ' + cls : '') + '" data-act="' + keyAct + '" data-key="' + k + '"' + (extra || '') + '>' + label + '</button>';
    }
    return keys.map(function (k) {
      if (k === 'back') return key('back', '⌫', 'fn', ' aria-label="退格"');
      if (k === 'clear') return key('clear', '清空', 'fn');
      return key(k, k);
    }).join('') + '<div class="donecell">' + doneHtml + '</div>' + key('.', '.') + key('0', '0') + key('00', '00');
  }

  function renderFormPage() {
    var d = state.draft;
    var sheetCls = 'sheet' + (d.entry && d.entry.deleted_at ? ' readonly' : '');
    var keypad = keypadHtml('key', '<button class="primary savebtn donekey" data-act="save"><span class="sb-label">完成</span>' +
      '<svg class="sb-spin" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 1-9 9" /></svg>' +
      '<svg class="sb-check" viewBox="0 0 24 24" aria-hidden="true"><path pathLength="1" d="M6 12.5l4 4 8-9" /></svg></button>');
    var actions = '';
    if (d.entry && d.entry.deleted_at) keypad = '';      // 已删除的账目：没有数字键盘和“完成”，只能恢复
    if (d.entry && d.entry.deleted_at) actions = '<button class="primary" data-act="restore" data-id="' + esc(d.id) + '">恢复这笔账目</button>';
    else if (d.entry) actions = '<button class="link danger" data-act="delete" data-id="' + esc(d.id) + '">删除这笔账目</button>';
    $('page-form').innerHTML =
      '<div class="formbar"><div class="seg" id="grid-tabs"></div><button class="link cancel" data-act="form-cancel">取消</button></div>' +
      '<div class="catgrid" id="catgrid"></div>' +
      // 面板后面的半透明遮罩：点一下 = 关闭面板，不保存（新记录清空已填内容；编辑放弃修改并回到列表）
      '<div class="sheet-backdrop" id="sheet-backdrop" data-act="sheet-dismiss" hidden></div>' +
      '<div class="' + sheetCls + '" id="entry-sheet" role="dialog" aria-label="填写金额" hidden>' +
        '<div class="grab" aria-hidden="true"></div>' +
        '<div class="sheet-head"><button class="sheet-cat" id="sheet-cat" data-act="back-grid" aria-label="重新选择类别"></button>' +
        '<div class="sheet-amt" id="sheet-amt"></div></div>' +
        '<div id="sheet-hint" class="sheet-hint" role="alert" hidden></div>' +
        '<div id="sheet-warn"></div>' +
        '<div class="chips" id="chips"></div>' +
        '<div class="chip-panel" id="chip-panel" hidden></div>' +
        '<input id="f-note" class="note" maxlength="1000" autocomplete="off" enterkeyhint="done" placeholder="备注（可不填）" value="' + esc(d.note) + '"' +
          (d.entry && d.entry.deleted_at ? ' readonly' : '') + '>' +
        '<div class="keypad" id="keypad">' + keypad + '</div>' +
        '<div class="sheet-actions" id="sheet-actions">' + actions + '</div>' +
      '</div>' +
      '<div class="minisheet" id="addcat-box" hidden><div class="mini-card"><label class="field">新类别名称' +
        '<input id="f-newcat" maxlength="30" autocomplete="off" placeholder="例如：健身"></label>' +
        '<div class="row"><button class="secondary" data-act="addcat-cancel">取消</button><button class="primary" data-act="addcat-ok">添加</button></div></div></div>';
    state.saving = false;
    renderGrid();
    renderSheetStatic();
  }

  /** 第 1 步：类别网格（支出/收入标签 + 当前类型的类别 + 最后一个“添加”）。 */
  function renderGrid() {
    var d = state.draft, type = state.gridType;
    function tab(t, label) {
      var locked = !d.isManual && d.type !== t;     // 自动记录的收支类型不可改
      return '<button data-act="tab" data-type="' + t + '" class="' + (type === t ? 'on' : '') + '"' + (locked ? ' disabled' : '') + '>' + label + '</button>';
    }
    $('grid-tabs').innerHTML = tab('expense', '支出') + tab('income', '收入');
    var html = categoriesOf(type, d.type === type ? d.category_id : '').map(function (c) {
      var on = c.id === d.category_id;
      return '<button class="tile' + (on ? ' on' : '') + '" data-act="pick" data-id="' + esc(c.id) + '" aria-pressed="' + on + '">' +
        '<span class="ic">' + iconInner(c.name) + '</span><span class="nm">' + esc(c.name) + '</span></button>';
    }).join('');
    if (d.isManual) {
      html += '<button class="tile add" data-act="add-tile"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 6v12M6 12h12"/></svg></span><span class="nm">添加</span></button>';
    }
    $('catgrid').innerHTML = html;
  }

  /** 第 2 步面板里不随输入变化的部分（只在打开页面时画一次）。 */
  function renderSheetStatic() {
    var d = state.draft, e = d.entry, warn = '';
    if (e && e.deleted_at) warn += '<div class="warnbox">这笔账目已删除</div>';
    if (e && e.amount_cents === null) warn += '<div class="warnbox">无法识别金额，需要用户自行查看收据后补填</div>';
    if (e && !e.deleted_at && e.status === 'dup_review') {
      warn += '<div class="warnbox" id="dup-box">可能与另一个渠道记下的一笔重复（金额相同、时间接近）。确认是两笔不同的消费，请点“两笔都保留”；' +
        '如果是同一笔，请删除其中一笔。<div class="row"><button class="secondary" data-act="keep-dups" data-id="' + esc(e.id) + '">两笔都保留</button></div></div>';
    }
    if (e && !d.isManual) warn += '<p class="muted">记录渠道：' + esc(e.channel_label) + '（自动记录，渠道不可修改）</p>';
    $('sheet-warn').innerHTML = warn;
    updateSheetHead();
    renderChips();
  }
  function updateSheetHead() {
    var d = state.draft, c = findCategory(d.category_id);
    $('sheet-cat').innerHTML = (c ? catIcon(c.name) + '<span class="nm">' + esc(c.name) + '</span>' : '<span class="nm">选择类别</span>') +
      '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 10l5 5 5-5"/></svg>';
    updateAmount();
  }
  function updateAmount() {
    var d = state.draft, el = $('sheet-amt');
    el.textContent = '$' + (d.amount || '0');
    el.className = 'sheet-amt ' + d.type + (d.amount ? '' : ' amt-empty');   // 不用 empty：全局 .empty 有 40px 上下留白
  }
  function showHint(msg) {
    var h = $('sheet-hint');
    h.textContent = msg || ''; h.hidden = !msg;
  }

  // ----- 小标签（日期 / 商家 / 这是退款 / 来源） -----
  function dateChipText(d) {
    var dt = d.local_datetime || '';
    var time = dt.slice(11, 16);
    if (dt.slice(0, 10) === state.boot.today_ny) return '今天 ' + time;
    return (+dt.slice(5, 7)) + ' 月 ' + (+dt.slice(8, 10)) + ' 日 ' + time;
  }
  function refundOptions(d) {
    var list = d.candidates.filter(function (c) { return c.id !== d.id; });
    return list;
  }
  function refundLabel(d) {
    if (!d.refund_of) return '';
    var hit = refundOptions(d).filter(function (c) { return c.id === d.refund_of; })[0];
    if (hit) return (hit.merchant || hit.category_name) + ' ' + money(hit.amount_cents);
    return (d.entry && d.entry.refund_of_label) || '原交易';
  }
  function sourceLabel(d) {
    if (d.source_sel === '__new__') return String(d.new_source || '').trim();
    var s = state.boot.sources.filter(function (x) { return x.id === d.source_sel; })[0];
    return s ? s.name : '';
  }
  function chipDefs(d) {
    var defs = [{ key: 'date', text: dateChipText(d), on: false }];
    var m = String(d.merchant || '').trim();
    defs.push({ key: 'merchant', text: m ? '商家：' + m : '商家', on: !!m });
    if (d.type === 'expense' && (d.isManual || isRefundEntry(d))) {
      var rl = refundLabel(d);
      defs.push({ key: 'refund', text: isRefundEntry(d) ? '退款' + (rl ? '：' + rl : '') : '这是退款', on: isRefundEntry(d) });
    }
    if (d.type === 'income') {
      var sl = sourceLabel(d);
      defs.push({ key: 'source', text: sl ? '来源：' + sl : '来源', on: !!sl });
    }
    return defs;
  }
  function renderChips() {
    var d = state.draft;
    $('chips').innerHTML = chipDefs(d).map(function (c) {
      return '<button class="chip' + (c.on ? ' on' : '') + (d.expanded === c.key ? ' open' : '') + '" data-act="chip" data-chip="' + c.key + '">' + esc(c.text) + '</button>';
    }).join('');
    renderChipPanel();
  }
  function updateChipLabels() {       // 输入时只更新标签文字，不重画输入框（不丢焦点）
    var d = state.draft, btns = $('chips').querySelectorAll('.chip');
    chipDefs(d).forEach(function (c, i) {
      if (!btns[i]) return;
      btns[i].textContent = c.text;
      btns[i].classList.toggle('on', c.on);
    });
  }
  function renderChipPanel() {
    var d = state.draft, box = $('chip-panel'), html = '', focusId = null;
    if (d.expanded === 'date') {
      html = '<label class="field">日期时间（费城时间）<input id="f-datetime" type="datetime-local" value="' + esc(d.local_datetime) + '"></label>';
    } else if (d.expanded === 'merchant') {
      html = '<label class="field">商家／说明<input id="f-merchant" maxlength="200" autocomplete="off" enterkeyhint="done" value="' + esc(d.merchant) + '"></label>';
      focusId = 'f-merchant';
    } else if (d.expanded === 'refund') {
      var opts = '<option value="">不关联原交易</option>' + refundOptions(d).map(function (c) {
        return '<option value="' + esc(c.id) + '" data-cat="' + esc(c.category_id) + '"' + (d.refund_of === c.id ? ' selected' : '') + '>' +
          esc(c.date_ny + ' ' + (c.merchant || c.category_name) + ' ' + money(c.amount_cents)) + '</option>';
      }).join('');
      if (d.refund_of && !refundOptions(d).some(function (c) { return c.id === d.refund_of; })) {
        opts += '<option value="' + esc(d.refund_of) + '" selected>' + esc((d.entry && d.entry.refund_of_label) || '原交易') + '</option>';
      }
      html = '<label class="field">关联的原交易<select id="f-refund-of">' + opts + '</select></label>' +
        (d.isManual ? '<button class="link" data-act="refund-off">不是退款</button>' : '');
    } else if (d.expanded === 'source') {
      var src = '<option value=""' + (d.source_sel === '' ? ' selected' : '') + '>不填</option>' + state.boot.sources.filter(function (s) {
        return !s.archived || s.id === d.source_sel;
      }).map(function (s) {
        return '<option value="' + esc(s.id) + '"' + (s.id === d.source_sel ? ' selected' : '') + '>' + esc(s.name) + '</option>';
      }).join('') + '<option value="__new__"' + (d.source_sel === '__new__' ? ' selected' : '') + '>＋ 新建来源…</option>';
      html = '<label class="field">具体来源<select id="f-source">' + src + '</select></label>' +
        (d.source_sel === '__new__' ? '<label class="field">新来源名称<input id="f-new-source" maxlength="60" autocomplete="off" enterkeyhint="done" placeholder="例如：兼职 C" value="' + esc(d.new_source) + '"></label>' : '');

  // ----- 抽屉的打开 / 关闭、键盘显示 / 隐藏 -----
  function openSheet() {
    var sh = $('entry-sheet'), bd = $('sheet-backdrop');

    sh.hidden = false;
    if (bd) bd.hidden = false;

  function closeSheet(immediate) {
    var sh = $('entry-sheet'), bd = $('sheet-backdrop');
    state.sheetOpen = false;
    if (document.activeElement && isTextField(document.activeElement)) document.activeElement.blur();
    if (!sh) return;
    sh.classList.remove('open');
    if (bd) bd.classList.remove('show');
    $('page-form').classList.remove('sheet-open');
    if (immediate || prefersReducedMotion()) { sh.hidden = true; if (bd) bd.hidden = true; return; }
    setTimeout(function () { if (!state.sheetOpen) { sh.hidden = true; if (bd) bd.hidden = true; } }, 300);

  /**
   * 点面板外面（遮罩）：关闭面板，不保存、不确认。

   * - 编辑：放弃这次修改，回到账目列表。
   */
  function dismissSheet() {
    var d = state.draft;
    if (!d || state.saving) return;
    if (d.id) { show(state.lastPage || 'entries'); return; }
    var gridType = state.gridType;
    state.draft = newDraft(null, d.candidates);
    state.gridType = gridType;
    closeSheet();

  /** 备注或小标签里的文字框有焦点时，自定义键盘让位给手机键盘（样式里只隐藏、不占用/释放空间，避免页面跳动）。 */
  function syncTyping() {
    var sh = $('entry-sheet');

    var ae = document.activeElement;

  /** 选中一个类别（网格里点击，或新建类别之后）。面板已打开就直接换类别，没打开就滑出来。 */
  function selectCategory(id) {
    var d = state.draft, c = findCategory(id);
    if (!c) return;
    if (c.type !== d.type) {            // 换了收支类型：退款、来源这类只属于某一边的设置清掉；金额、备注等保留

  function prefersReducedMotion() {
    return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  }
  function delay(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function rand(min, max) { return min + Math.random() * (max - min); }

  /** 从按钮中心迸发一圈粒子（圆点／星星／爱心混合）。 */
  function burstParticles(btn) {
    var A = SAVE_ANIM;
    var rect = btn.getBoundingClientRect();
    var cx = rect.left + rect.width / 2, cy = rect.top + rect.height / 2;
    var longest = 0;
    for (var i = 0; i < A.PARTICLE_COUNT; i++) {
      var shape = A.SHAPES[i % A.SHAPES.length];
      var p = document.createElement('span');
      p.className = 'save-particle';
      p.setAttribute('data-shape', shape);
      var color = A.COLORS[Math.floor(Math.random() * A.COLORS.length)];
      p.style.left = cx + 'px'; p.style.top = cy + 'px'; p.style.color = color;
      if (shape === 'dot') {
        p.style.width = A.PARTICLE_SIZE_PX + 'px'; p.style.height = A.PARTICLE_SIZE_PX + 'px';
        p.style.borderRadius = '50%'; p.style.background = color;
      } else {
        p.style.fontSize = (A.PARTICLE_SIZE_PX * A.GLYPH_SCALE) + 'px';
        p.textContent = shape === 'star' ? '\u2605\uFE0E' : '\u2665\uFE0E'; // 带 FE0E：强制用文字样式，不变成彩色表情
      }
      document.body.appendChild(p);
      var angle = (i / A.PARTICLE_COUNT) * Math.PI * 2 + rand(-0.12, 0.12);
      var dist = A.BURST_PX * rand(A.BURST_JITTER_MIN, A.BURST_JITTER_MAX);
      var dur = animMs(rand(A.PARTICLE_MIN_MS, A.PARTICLE_MAX_MS));
      longest = Math.max(longest, dur);
      if (p.animate) {
        p.animate([
          { transform: 'translate(-50%,-50%) translate(0,0) scale(1) rotate(0deg)', opacity: 1 },
          { transform: 'translate(-50%,-50%) translate(' + (Math.cos(angle) * dist).toFixed(1) + 'px,' + (Math.sin(angle) * dist).toFixed(1) +
            'px) scale(0.6) rotate(' + Math.round(rand(-180, 180)) + 'deg)', opacity: 0 }
        ], { duration: dur, easing: 'cubic-bezier(.15,.7,.3,1)', fill: 'forwards' });
      }
    }
    setTimeout(function () {
      document.querySelectorAll('.save-particle').forEach(function (n) { n.remove(); });
    }, longest + 80);
  }

  /** 保存成功：按钮上方飘起一行“−32.00 已记好”（收入 +，支出 −），约 1.1 秒后移除。 */
  function floatAmount(btn, saved) {
    if (!saved || saved.amount_cents === null || saved.amount_cents === undefined) return;
    var abs = Math.abs(saved.amount_cents);
    var plus = saved.type === 'income' || (saved.type === 'expense' && !!saved.is_refund);   // 退款：钱回来了，算“+”
    var txt = (plus ? '+' : '\u2212') + Math.floor(abs / 100) + '.' + String(abs % 100).padStart(2, '0') + ' 已记好';
    var r = btn.getBoundingClientRect();
    var f = document.createElement('div');
    f.className = 'save-float';
    f.textContent = txt;
    f.style.left = (r.left + r.width / 2) + 'px';
    f.style.top = (r.top - 6) + 'px';
    document.body.appendChild(f);
    setTimeout(function () { if (f.parentNode) f.parentNode.removeChild(f); }, 1100);
  }

  /** 保存成功：深薄荷绿 + 对勾 + 弹一下 + 粒子（“减少动态效果”时只显示对勾）。 */
  function playSuccess(btn, reduced, saved) {
    btn.classList.remove('saving');
    btn.classList.add('done');
    playSound('r3');
    if (reduced) return;
    floatAmount(btn, saved);
    if (btn.animate) {
      btn.animate([{ transform: 'scale(1)' }, { transform: 'scale(' + SAVE_ANIM.BOUNCE_PEAK + ')', offset: 0.5 }, { transform: 'scale(1)' }],
        { duration: animMs(SAVE_ANIM.BOUNCE_MS), easing: 'ease-in-out' });
    }
    burstParticles(btn);
  }

  /** 保存失败：按钮恢复原样，（可）左右抖一下，提示错误；表单内容原封不动。 */
  function saveFailed(btn, err, reduced) {
    state.saving = false;
    btn.removeAttribute('aria-busy');
    btn.classList.remove('shrunk', 'saving', 'done');
    if (!reduced) {
      btn.classList.remove('shake'); void btn.offsetWidth; btn.classList.add('shake');
      setTimeout(function () { btn.classList.remove('shake'); }, SAVE_ANIM.SHAKE_MS + 50);
    }
    toast((err && err.message) || '没保存成功，再试一次');
  }

  function saveForm(btn) {
    if (state.saving) return;                       // 防止重复点击造成重复记账
    if (!state.draft.id && !amountIsPositive(state.draft.amount)) { showHint('先填金额'); return; }   // 新记录必须有金额，不发请求
    var input = collectForm();
    var reduced = prefersReducedMotion();
    state.saving = true;
    btn.setAttribute('aria-busy', 'true');
    btn.style.setProperty('--t-shrink', animMs(SAVE_ANIM.SHRINK_MS) + 'ms');
    btn.style.setProperty('--t-check', animMs(SAVE_ANIM.CHECK_MS) + 'ms');
    btn.classList.add('shrunk', 'saving');
    // 至少等按钮缩成圆形，再显示结果
    Promise.all([api('api_saveEntry', input), delay(reduced ? 0 : animMs(SAVE_ANIM.SHRINK_MS))]).then(function (res) {
      var saved = res[0];
      playSuccess(btn, reduced, saved);
      return delay(reduced ? SAVE_ANIM.REDUCED_NAV_DELAY_MS : SAVE_ANIM.NAV_DELAY_MS).then(function () {
        state.month = saved.month_ny;
        state.filter = 'all';
        state.saving = false;
        return refreshBoot().then(loadEntries).catch(fail);
      });
    }, function (err) { saveFailed(btn, err, reduced); });
  }

  // ---------- 圆环图（内嵌 SVG，不用任何图表库） ----------
  var DONUT_COLORS = ['#5DCAA5', '#F0997B', '#ED93B1', '#FAC775', '#AFA9EC', '#85B7EB'];
  var DONUT_REST = '#B4B2A9';          // 第 7 项起（以及“其余”合并块）用灰色
  var RING_MIN_LEN = 20;   // 最小可见弧长：约 2% 圈
  var BUDGET_COLORS = { ok: '#5DCAA5', near: '#EF9F27', over: '#E24B4A' };

  /**
   * 圆环切片（纯函数，方便测试）。rows: [{name, cents}]，已按金额从大到小排好。
   * 只有金额 > 0 的行画进圆环（净退款的行只在图例里列出）。前 6 行各用一种颜色，其余合并成一块灰色。
   * 每块长度以“千分之一圈”为单位，用整数累计计算，所有块加起来正好 1000。
   * 返回 {colors: 每一行的颜色（没画进圆环的为 null）, slices: [{name, color, start, len}]}。
   */
  function donutSlices(rows) {
    var total = 0, colors = [], parts = [], rest = null, restCount = 0;
    rows.forEach(function (r) { if (r.cents > 0) total += r.cents; });
    var n = 0;
    rows.forEach(function (r) {
      if (!(r.cents > 0)) { colors.push(null); return; }
      if (n < DONUT_COLORS.length) {
        colors.push(DONUT_COLORS[n]);
        parts.push({ name: r.name, color: DONUT_COLORS[n], cents: r.cents });
      } else {
        colors.push(DONUT_REST);
        restCount++;
        if (!rest) { rest = { name: '', color: DONUT_REST, cents: 0 }; parts.push(rest); }
        rest.cents += r.cents;
      }
      n++;
    });
    if (rest) rest.name = '其余 ' + restCount + ' 项';
    var cum = 0, slices = [];
    parts.forEach(function (p) {
      var start = Math.floor(cum * 1000 / total);
      cum += p.cents;
      var end = Math.floor(cum * 1000 / total);
      if (end > start) slices.push({ name: p.name, color: p.color, start: start, len: end - start });
    });
    return { colors: colors, slices: slices };
  }

  var RING_C = 'cx="60" cy="60" r="48" fill="none" transform="rotate(-90 60 60)"';
  /** 圆环 SVG。segs: [{color, start, len}]（单位 1/1000 圈）；centerHtml 叠在圆环中间。 */
  function donutHtml(segs, label, centerHtml, extraCls) {
    var svg = '<svg viewBox="0 0 120 120" role="img" aria-label="' + esc(label) + '">' +
      '<circle class="ring-track" ' + RING_C + ' pathLength="1000"/>' +
      segs.map(function (s) {
        // 整圈：画成不带 dasharray 的完整圆，避免 12 点钟方向出现接缝
        if (s.len >= 1000 && !s.start) return '<circle class="donut-seg full' + (s.cls ? ' ' + s.cls : '') + '" ' + RING_C + ' stroke="' + s.color + '" data-len="1000"/>';
        return '<circle class="donut-seg' + (s.cls ? ' ' + s.cls : '') + '" ' + RING_C + ' pathLength="1000" stroke="' + s.color +
          '" stroke-dasharray="' + s.len + ' 1000" stroke-dashoffset="' + (-s.start) + '" data-len="' + s.len + '"/>';
      }).join('') + '</svg>';
    return '<div class="donut' + (extraCls ? ' ' + extraCls : '') + '">' + svg + '<div class="ring-center">' + centerHtml + '</div></div>';
  }
  function centerHtml(k, v, vCls, vId) {
    return '<span class="rc-k">' + esc(k) + '</span><strong' + (vId ? ' id="' + vId + '"' : '') + (vCls ? ' class="' + vCls + '"' : '') + '>' + v + '</strong>';
  }
  /** 图例：每一行 色块 + 名称 + 金额 · 百分比（百分比沿用月报规则，由服务器算好）。 */
  function legendRows(rows, colors, withSources) {
    return rows.map(function (r, i) {
      var sw = colors && colors[i] ? '<i class="sw" style="background:' + colors[i] + '"></i>' : '<i class="sw none"></i>';
      var html = '<div class="lg-row">' + sw + '<span class="lg-name">' + esc(r.name) + (r.net_refund ? '（净退款）' : '') +
        '</span><span class="lg-val">' + money(r.cents) + (r.percent_tenths !== null && r.percent_tenths !== undefined ? ' · ' + pct(r.percent_tenths) : '') + '</span></div>';
      if (withSources && r.sources && r.sources.length) {
        html += '<button class="link" data-act="toggle-sources">展开来源</button><div class="sources" hidden>' +
          legendRows(r.sources, null, false) + '</div>';
      }
      return html;
    }).join('');
  }
  function donutCard(id, title, section, centerK, withSources, emptyText) {
    var ds = donutSlices(section.rows);
    var label = title + '：' + section.rows.map(function (r) { return r.name + ' ' + money(r.cents) + (r.percent_tenths !== null ? ' ' + pct(r.percent_tenths) : ''); }).join('，');
    return '<div class="card chart-card" id="' + id + '"><h2>' + title + '</h2>' +
      donutHtml(ds.slices, label, centerHtml(centerK, money(section.total_cents))) +
      (section.rows.length ? '<div class="legend">' + legendRows(section.rows, ds.colors, withSources) + '</div>' : '<p class="muted center">' + emptyText + '</p>') +
      '</div>';
  }

  // ---------- 报表：月报 / 账单 ----------
  function reportTabsHtml() {
    function b(tab, label) { return '<button data-act="rtab" data-tab="' + tab + '" class="' + (state.reportTab === tab ? 'on' : '') + '">' + label + '</button>'; }
    return '<div class="seg" id="report-tabs">' + b('month', '月报') + b('bills', '账单') + b('savings', '储蓄') + b('habits', '消费习惯') + '</div>';
  }
  function loadReportPage() {
    if (state.reportTab === 'savings') return loadSavings();
    if (state.reportTab === 'habits') return loadSpendingHabits();
    if (state.reportTab === 'bills') return loadBills();
    return loadReport(state.reportMonth || state.boot.report_default_month);
  }
  function loadReport(month) {
    state.reportTab = 'month';
    state.reportMonth = month;
    show('report');
    var ticket = ++state.insightsRequest;
    return api('api_getReport', month).then(function (r) {
      if (ticket === state.insightsRequest && reportSectionActive('month')) renderReport(r);
    }).catch(fail);
  }
  function renderReport(r) {
    var html = reportTabsHtml() + '<div class="monthnav"><button data-act="rprev" aria-label="上个月">‹</button><strong>' + monthLabel(r.month) +
      '</strong><button data-act="rnext" aria-label="下个月">›</button></div>';
    html += '<p class="muted">' + (r.generated_on ? '生成于 ' + (+r.generated_on.slice(5, 7)) + ' 月 1 日' : '本月进行中') +
      (r.last_changed_local ? '，最后更新于 ' + esc(r.last_changed_local.replace('T', ' ')) : '') + '</p>';
    if (r.pending_count > 0) {
      html += '<button class="banner" data-act="goto-pending" data-month="' + esc(r.month) + '">有 ' + r.pending_count +
        ' 笔金额未补全，以下统计不完整（点击前往补全）</button>';
    }
    html += donutCard('report-expense', '支出', r.expense, '总支出', false, '没有支出');
    html += donutCard('report-income', '收入', r.income, '总收入', true, '没有收入');
    var c = r.comparison;
    var cmpRows = [{ name: '收入', cents: c.income_cents }, { name: '支出', cents: c.expense_cents }];
    var cmp = donutSlices(cmpRows);
    var cmpColors = [BUDGET_COLORS.ok, DONUT_COLORS[1]];
    var segs = cmp.slices.map(function (s) { return { color: s.name === '收入' ? cmpColors[0] : cmpColors[1], start: s.start, len: s.len }; });
    html += '<div class="card chart-card" id="report-compare"><h2>收支对比</h2>' +
      donutHtml(segs, '收支对比：收入 ' + money(c.income_cents) + '，支出 ' + money(c.expense_cents) + '，结余 ' + money(c.diff_cents),
        centerHtml('结余', money(c.diff_cents), c.diff_cents < 0 ? 'neg' : '', 'diff')) +
      '<div class="legend">' +
      '<div class="lg-row"><i class="sw" style="background:' + cmpColors[0] + '"></i><span class="lg-name">收入</span><span class="lg-val">' + money(c.income_cents) + '</span></div>' +
      '<div class="lg-row"><i class="sw" style="background:' + cmpColors[1] + '"></i><span class="lg-name">支出</span><span class="lg-val">' + money(c.expense_cents) + '</span></div>' +
      '<div class="lg-row"><i class="sw none"></i><span class="lg-name">结余（收入 − 支出）</span><span class="lg-val' + (c.diff_cents < 0 ? ' neg' : '') + '">' + money(c.diff_cents) + '</span></div>' +
      '</div></div>';
    if (r.budget) html += budgetSummaryCard(r);
    $('page-report').innerHTML = html;
  }
  /** 月报里的“本月预算小结”（spec 7A.2）：该月当时有效的预算；一句白话总结 + 每项的已用 / 剩余或超出。 */
  function budgetSummaryCard(r) {
    var v = r.budget.view;
    var items = (v.total ? [v.total] : []).concat(v.categories);
    var title = r.is_current_month ? '本月预算小结' : (+r.month.slice(5, 7)) + ' 月预算小结';
    return '<div class="card" id="report-budget"><h2>' + title + '</h2><p class="bsum">' + esc(r.budget.summary) + '</p>' +
      items.map(function (it) {
        var over = it.remaining_cents < 0;
        return '<div class="list-item"><span>' + esc(it.name) + '<br><span class="muted">已用 ' + money(it.used_cents) + ' / ' + money(it.budget_cents) + '</span></span>' +
          '<span class="' + (over ? 'neg' : '') + '">' + (over ? '超出 ' + money(-it.remaining_cents) : '剩余 ' + money(it.remaining_cents)) + '</span></div>';
      }).join('') +
      (v.pending_count > 0 ? '<p class="incomplete-hint">有 ' + v.pending_count + ' 笔未补全，预算统计不完整</p>' : '') + '</div>';
  }

  // ----- 账单：月账单（某年每个月）/ 年账单（每一年） -----
  function loadBills() {
    state.reportTab = 'bills';
    show('report');
    var ticket = ++state.insightsRequest;
    if (state.billsTab === 'year') return api('api_getYearBills').then(function (r) {
      if (ticket === state.insightsRequest && reportSectionActive('bills')) renderYearBills(r);
    }).catch(fail);
    var year = state.billsYear || state.boot.current_month.slice(0, 4);
    state.billsYear = year;
    return api('api_getMonthBills', year).then(function (r) {
      if (ticket === state.insightsRequest && reportSectionActive('bills')) renderMonthBills(r);
    }).catch(fail);
  }
  function billsTabsHtml() {
    function b(tab, label) { return '<button data-act="btab" data-tab="' + tab + '" class="' + (state.billsTab === tab ? 'on' : '') + '">' + label + '</button>'; }
    return '<div class="seg small" id="bills-tabs">' + b('month', '月账单') + b('year', '年账单') + '</div>';

  function billHero(k, diff, inc, exp, kInc, kExp) {

  function openSavingsEditor(type, id) {

        savingsMoneyInput('sg-monthly', '每月计划存款（美元）', g ? centsToText(g.monthly_cents) : '', false, '填了日期时可留空，保存后按剩余金额和月份建议月存款；没有日期时，未完成的目标需要填写大于 0 的月存款。') +
        '<div class="savings-actions"><button type="submit" class="primary">保存目标</button><button type="button" class="secondary" data-act="savings-cancel">取消</button></div></fieldset><p class="savings-error" role="alert" hidden></p></form>';

      '<fieldset' + (state.savingsBusy || intent ? ' disabled' : '') + '>' + '<label for="sg-deposit-amount">本次存入（美元，必填）</label><input id="sg-deposit-amount" type="text" inputmode="decimal" required pattern="[0-9]{1,9}([.][0-9]{1,2})?" title="请填写大于 0 的金额，最多两位小数，例如 12.34" value="' + esc(payload ? payload.amount : '') + '">' +
      '<label for="sg-deposit-date">存入日期（费城时间）</label><input id="sg-deposit-date" type="date" required max="' + esc(state.savingsView.today_ny) + '" value="' + esc(payload ? payload.date_ny : state.savingsView.today_ny) + '"></fieldset>' +
      (intent ? '<p class="incomplete-hint">上一笔存入的结果尚未确认。重试会使用同一笔记录，不会重复累计。确认后才可记录新的一笔。</p>' : '') +
      '<div class="savings-actions"><button type="submit" class="primary"' + (state.savingsBusy ? ' disabled' : '') + '>' + (intent ? '重试确认这笔存入' : '确认存入') + '</button><button type="button" class="secondary" data-act="savings-cancel"' + (state.savingsBusy ? ' disabled' : '') + '>收起</button></div><p class="savings-error" role="alert" hidden></p></form>';
  }
  function savingsRequestId() {
    return window.crypto && typeof window.crypto.randomUUID === 'function' ? window.crypto.randomUUID() : 'deposit_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2);
  }
  function setSavingsFormBusy(form, busy) {
    form.setAttribute('aria-busy', busy ? 'true' : 'false');
    form.querySelectorAll('fieldset').forEach(function (el) { el.disabled = busy || (form.id === 'savings-deposit-form' && !!state.savingsDepositIntent); });
    form.querySelectorAll('button, input').forEach(function (el) { el.disabled = busy; });
    // An uncertain deposit is immutable: retries must retain exactly the same payload.
    if (!busy && form.id === 'savings-deposit-form' && state.savingsDepositIntent) {
      form.querySelectorAll('input').forEach(function (el) { el.disabled = true; });
    }

  document.addEventListener('submit', function (ev) {
    var form = ev.target;
    if (!form.classList.contains('savings-form')) return;
    ev.preventDefault();
    if (state.savingsBusy || !state.savingsView || !state.savingsView.ready) return;
    var rpc, input;
    if (form.id === 'savings-goal-form') {
      rpc = 'api_saveSavingsGoal';
      input = { name: $('sg-name').value, target_amount: $('sg-target').value, starting_saved_amount: $('sg-start').value,
        monthly_amount: $('sg-monthly').value, target_date: $('sg-date').value };
      if (state.savingsEditor.goalId) input.id = state.savingsEditor.goalId;
    } else if (form.id === 'savings-deposit-form') {
      rpc = 'api_recordSavingsContribution';
      if (!state.savingsDepositIntent && !(Number($('sg-deposit-amount').value) > 0)) {
        var amountError = form.querySelector('.savings-error');
        amountError.textContent = '存入金额请填写大于 0 的金额，例如 12.34'; amountError.hidden = false; return;
      }
      if (!state.savingsDepositIntent) state.savingsDepositIntent = { payload: {
        request_id: savingsRequestId(), goal_id: state.savingsEditor.goalId, amount: $('sg-deposit-amount').value, date_ny: $('sg-deposit-date').value
      }};
      input = state.savingsDepositIntent.payload;

      rpc = 'api_saveSavingsEstimates';
      input = { month: state.savingsView.current_month, income_amount: $('sg-income').value };
      if ($('sg-expense')) input.expense_amount = $('sg-expense').value;

    state.savingsBusy = true;

    var error = form.querySelector('.savings-error'); error.hidden = true;
    api(rpc, input).then(function (view) {
      // Invalidate savings reads started before this authoritative response, including after leaving and returning.
      state.savingsWriteEpoch += 1;
      state.savingsBusy = false;
      state.savingsView = view;
      if (rpc === 'api_recordSavingsContribution') state.savingsDepositIntent = null;
      if (rpc !== 'api_saveSavingsEstimates') state.savingsEditor = null;
      renderSavings(view);
      toast('已保存');
      refreshBoot().catch(function () {}); // 储蓄规则已在写入后运行，刷新小猫红点；刷新失败不影响保存结果。
    }).catch(function (err) {
      state.savingsBusy = false;
      if (form.isConnected) {
        setSavingsFormBusy(form, false);
        error.textContent = err.message || '保存失败，请重试'; error.hidden = false;
        if (rpc === 'api_recordSavingsContribution') {
          form.querySelector('button[type="submit"]').textContent = '重试确认这笔存入';
          error.textContent += '。请重试确认同一笔存入，确认后再记录新的一笔。';
        }
      }
      if (!form.isConnected && reportSectionActive('savings')) renderSavings(state.savingsView);
      fail(err);
    });
  });

  // ---------- 消费习惯：真实类别；退款保留负数 ----------
  /** 分组：手动选过类别的按类别；仍是“未分类”的 Apple Pay 账目单独算作“Apple Pay”。 */
  function habitGroup(e) {
    var cat = findCategory(e.category_id);
    if (e.channel === 'apple_pay' && cat && cat.system_key === 'uncategorized') return { key: 'channel:apple_pay', name: 'Apple Pay' };
    return { key: e.category_id || '', name: e.category_name };
  }
  function categoryTotalsThrough(list, cutoff) {
    var rows = Object.create(null), pending = 0;
    list.days.forEach(function (day) {
      if (day.date > cutoff) return;
      day.entries.forEach(function (e) {
        if (e.type !== 'expense') return;
        if (e.amount_cents === null || e.amount_cents === undefined) { pending++; return; }
        var group = habitGroup(e);
        if (!rows[group.key]) rows[group.key] = { id: group.key, name: group.name, cents: 0 };
        rows[group.key].cents += e.amount_cents;
      });
    });
    return { rows: rows, pending_count: pending };
  }
  function loadSpendingHabits() {
    show('report');
    var ticket = ++state.insightsRequest;
    $('page-report').innerHTML = reportTabsHtml() + '<p role="status">正在读取消费习惯…</p>';
    // Bootstrap supplies the New York date; refresh it so an open page also handles a new month.
    return refreshBoot().then(function (boot) {
      var month = boot.current_month, today = boot.now_local.slice(0, 10), previous = addMonths(month, -1);
      var lastDay = new Date(Date.UTC(+previous.slice(0, 4), +previous.slice(5, 7), 0)).getUTCDate();
      var cutoff = previous + '-' + String(Math.min(+today.slice(8, 10), lastDay)).padStart(2, '0');
      var months = [-3, -2, -1].map(function (n) { return addMonths(month, n); });
      // 三个完整月也逐笔读取，才能和同期对比用同一种分组（Apple Pay 未分类单独一行）
      return Promise.all([api('api_listMonth', month, 'all'), api('api_listMonth', previous, 'all')].concat(months.map(function (m) { return api('api_listMonth', m, 'all'); }))).then(function (res) {
        if (ticket !== state.insightsRequest || !reportSectionActive('habits')) return;
        var reports = res.slice(2).map(function (list, i) { var t = categoryTotalsThrough(list, '9999-12-31'); t.month = months[i]; return t; });
        renderSpendingHabits(today, cutoff, categoryTotalsThrough(res[0], today), categoryTotalsThrough(res[1], cutoff), reports);
      });
    }).catch(function (err) {
      if (ticket !== state.insightsRequest || !reportSectionActive('habits')) return;
      $('page-report').innerHTML = reportTabsHtml() + '<div class="warnbox">' + esc(err.message || '暂时无法读取消费习惯') + '</div><button class="secondary" data-act="habits-refresh">重新读取</button>';
    });
  }
  function renderSpendingHabits(today, cutoff, current, previous, reports) {
    var rows = Object.create(null);
    Object.keys(current.rows).concat(Object.keys(previous.rows)).forEach(function (key) { rows[key] = current.rows[key] || previous.rows[key]; });
    var keys = Object.keys(rows).sort(function (a, b) { return (current.rows[b] ? current.rows[b].cents : 0) - (current.rows[a] ? current.rows[a].cents : 0); });
    var html = reportTabsHtml() + '<div class="card"><h2>本月与上月同期</h2><p class="muted">' + esc(today.slice(0, 7)) + '-01 至 ' + esc(today) + '<br>' + esc(cutoff.slice(0, 7)) + '-01 至 ' + esc(cutoff) + '（上月天数不足时取月末）</p>';
    if (current.pending_count + previous.pending_count > 0) html += '<p class="incomplete-hint">比较区间有 ' + (current.pending_count + previous.pending_count) + ' 笔支出金额未补全，比较不完整。</p>';
    html += keys.length ? '<div class="insights-scroll" role="region" aria-label="类别同期对比，可横向滚动" tabindex="0"><table class="insights-table"><thead><tr><th scope="col">消费类别</th><th scope="col">本月同期</th><th scope="col">上月同期</th><th scope="col">金额变化</th></tr></thead><tbody>' + keys.map(function (key) {
      var a = current.rows[key] ? current.rows[key].cents : 0, b = previous.rows[key] ? previous.rows[key].cents : 0, diff = a - b;
      return '<tr><th scope="row">' + esc(rows[key].name) + '</th><td>' + money(a) + '</td><td>' + money(b) + '</td><td>' + (diff > 0 ? '+' : '') + money(diff) + '</td></tr>';
    }).join('') + '</tbody></table></div>' : '<p class="muted">这两个区间还没有已知金额的消费。</p>';
    html += '</div><div class="card"><h2>最近 3 个完整月 · 类别变化</h2><p class="muted">按自然月展示，退款抵扣原消费类别。没有已知金额记录的月份显示 —。</p>';
    var trends = Object.create(null), pending = 0;
    reports.forEach(function (r, i) {
      pending += r.pending_count;
      Object.keys(r.rows).forEach(function (key) {
        var row = r.rows[key];
        if (!trends[key]) trends[key] = { name: row.name, cents: [null, null, null] };
        trends[key].cents[i] = row.cents;
      });
    });
    // 按 3 个月合计金额从高到低；合计相同时按名称
    var trendTotal = function (key) { return trends[key].cents.reduce(function (sum, c) { return sum + (c || 0); }, 0); };
    var trendKeys = Object.keys(trends).sort(function (a, b) { return trendTotal(b) - trendTotal(a) || trends[a].name.localeCompare(trends[b].name); });
    if (pending) html += '<p class="incomplete-hint">这 3 个月有 ' + pending + ' 笔账目金额未补全，趋势不完整。</p>';
    html += trendKeys.length ? '<div class="insights-scroll" role="region" aria-label="三个月类别变化，可横向滚动" tabindex="0"><table class="insights-table"><thead><tr><th scope="col">消费类别</th>' + reports.map(function (r) { return '<th scope="col">' + esc(r.month) + '</th>'; }).join('') + '</tr></thead><tbody>' + trendKeys.map(function (key) {
      var row = trends[key];
      return '<tr><th scope="row">' + esc(row.name) + '</th>' + row.cents.map(function (cents) { return '<td>' + money(cents) + '</td>'; }).join('') + '</tr>';
    }).join('') + '</tbody></table></div>' : '<p class="muted">最近 3 个完整月还没有已知金额的消费，记账后会在这里积累变化。</p>';
    $('page-report').innerHTML = html + '</div>';
  }

  // ---------- 预算（spec 7A；编辑只针对当前月） ----------
  function loadBudget(month) {

  /** 预算圆环：显示“剩余比例”；超出时整圈红色，中间写“超出 $X”。 */
  function budgetRing(t, animate) {
    var color = BUDGET_COLORS[t.state];
    var len = t.state === 'over' ? 1000 : t.remaining_pct * 10;
    // 接近预算时，剩余四舍五入成 0% 也要留一小段橙色，让状态看得见
    if (t.state === 'near' && len < RING_MIN_LEN) len = RING_MIN_LEN;
    var center = t.state === 'over'
      ? centerHtml('超出', money(-t.remaining_cents), 'over')
      : centerHtml('剩余', t.remaining_pct + '%', t.state === 'near' ? 'near' : '');
    var label = '总预算 ' + money(t.budget_cents) + '，已用 ' + t.used_pct + '%，' + (t.state === 'over' ? '超出 ' + money(-t.remaining_cents) : '剩余 ' + money(t.remaining_cents));
    var segs = len > 0 ? [{ color: color, start: 0, len: len, cls: animate ? 'anim' : '' }] : [];
    return donutHtml(segs, label, center, 'budget-ring');
  }

        '<div class="bbody">' + budgetRing(t, animate) + '<div class="bstats">' +

        '<div><div class="k">' + (v.is_current_month ? '本月预算' : m + ' 月预算') + '</div><div class="v">' + money(t.budget_cents) + '</div></div>' +
        '<div><div class="k">' + (v.is_current_month ? '本月支出' : m + ' 月支出') + '</div><div class="v">' + money(t.used_cents) + '</div></div>' +
        '</div></div>' +
        (v.days_left !== null ? '<p class="muted center" id="budget-days">' + (v.days_left > 0 ? '本月还剩 ' + v.days_left + ' 天' : '今天是本月最后一天') + '</p>' : '') +
        '</div>';
    } else {
      html += '<div class="card bempty" id="budget-empty"><div class="bempty-ic">' + donutHtml([], '还没有总预算', '<span class="rc-k">?</span>') + '</div>' +
        (v.is_current_month
          ? '<p><strong>还没有设置总预算</strong></p><p class="muted">设一个每月总预算，花了多少、还剩多少一眼就能看到；以后每个月自动沿用，不用重填。</p>' +
            (v.editable ? '<button class="primary" data-act="budget-edit" data-scope="total">设置总预算</button>' : '')
          : '<p class="muted">这个月没有设置总预算（' + m + ' 月支出 ' + money(v.total_used_cents) + '）</p>') + '</div>';
    }

    html += '<div class="card" id="budget-cats"><div class="bhead"><h2>类别预算</h2>' +
      (v.editable && budgetCandidates(v).length ? '<button class="link" data-act="budget-add">+ 添加</button>' : '') + '</div>';
    if (v.warning) html += '<div class="warnbox" id="budget-warning">' + esc(v.warning) + '（只是提醒，不影响保存）</div>';
    html += v.categories.length ? v.categories.map(function (c) {

  /** “+ 添加”可选的类别：未删除的支出类别，去掉“未分类”和本月已有预算的。 */

  function saveBudget(amount) {

  function botBubble(m) {

  function scrollChatToEnd() {

    } else if (!a.messages.length) {

  function openAssistant() {
    var ov = $('assistant-overlay');

  /** 点问题按钮：先插入“你问的问题”，再插入回答（回答即时计算，不保存、不产生红点）。 */
  function askAssistant(id, label) {
    var list = $('aov-list');
    list.insertAdjacentHTML('beforeend', '<div class="amsg me"><div class="abubble">' + esc(label) + '</div></div>');
    scrollChatToEnd();
    return api('api_askAssistant', id).then(function (ans) {
      if (!state.assistantOpen) return;
      list.insertAdjacentHTML('beforeend', botBubble(ans).replace('class="amsg bot"', 'class="amsg bot answer"'));
      scrollChatToEnd();
    }).catch(fail);
  }

  function startTransactionTable() {
    var today = state.boot.today_ny;
    $('aov-list').innerHTML = '<div class="abubble">选择报表的起止日期。系统会直接生成独立的收支明细文件，期初余额承接开始日期之前的已知账目余额（账本从 $0.00 开始累计）；如果你设置了预算，也会附上涉及月份的整月预算对比。</div>' +
      '<label class="table-date-label" for="table-start-date">开始日期</label><input id="table-start-date" type="date" value="' + esc(today.slice(0, 7) + '-01') + '">' +
      '<label class="table-date-label" for="table-end-date">结束日期</label><input id="table-end-date" type="date" value="' + esc(today) + '">' +
      '<button class="primary" data-act="table-generate">生成报表</button>';
  }
  function generateTransactionTable() {
    var start = $('table-start-date').value, end = $('table-end-date').value;
    if (!start || !end || start > end) { toast('请检查报表的开始和结束日期'); return; }
    var button = document.querySelector('[data-act="table-generate"]');
    button.disabled = true;
    button.textContent = '正在生成…';
    api('api_generateTransactionReport', start, end, window.I18N.lang()).then(function (result) {
      var warning = '';
      if (result.opening_pending_count) warning += '开始日期之前有 ' + result.opening_pending_count + ' 笔金额待补全，期初余额不完整。';
      if (result.pending_count) warning += '所选范围有 ' + result.pending_count + ' 笔金额待补全，相关余额已标注为不完整。';
      $('aov-list').innerHTML = '<div class="abubble">报表已生成，共 ' + result.transaction_count + ' 笔交易。账本没有被修改。</div>' +
        (warning ? '<p class="table-report-warning">' + esc(warning) + '</p>' : '') +
        '<p class="table-report-range">' + esc(result.start_date) + ' 至 ' + esc(result.end_date) + '</p>' +
        '<a class="primary table-report-link" target="_blank" rel="noopener" href="' + esc(result.spreadsheet_url) + '">在 Google Sheets 打开</a>' +
        '<a class="secondary table-report-link" target="_blank" rel="noopener" href="' + esc(result.excel_url) + '">下载 Excel 文件</a>';
    }).catch(function (err) {
      button.disabled = false;
      button.textContent = '生成报表';
      fail(err);
    });

  /** 我的 → 预算提醒比例：选好就保存；失败时恢复原来的选项。 */
  function saveNearPct(sel) {
    var before = state.boot.budget_near_pct;
    api('api_setBudgetNearPct', Number(sel.value)).then(function (r) {
      state.boot.budget_near_pct = r.budget_near_pct;
      refreshBoot().catch(function () {});        // 比例变了，小助手的红点可能变化
      toast('提醒比例已改为 ' + r.budget_near_pct + '%');
    }, function (err) { sel.value = String(before); fail(err); });
  }

  function refreshBoot() {
    return api('api_bootstrap').then(function (b) { state.boot = b; window.I18N.addCategories(b.categories); updateLauncher(); return b; });
  }

  // ---------- 点击事件（统一处理） ----------
  document.addEventListener('click', function (ev) {
    if (state.saving && !ev.target.closest('[data-act="save"]')) return;   // 保存动画期间忽略其他点击
    var ae = document.activeElement;
    if (isTextField(ae) && ae.closest('#entry-sheet') && !ev.target.closest('input, textarea, select, label')) ae.blur();   // 点到别处 = 收起手机键盘
    var nav = ev.target.closest('[data-nav]');
    if (nav) { navTap(nav); return; }
    var el = ev.target.closest('[data-act]');
    if (!el) return;
    var act = el.getAttribute('data-act'), id = el.getAttribute('data-id');
    if (act === 'prev' || act === 'next') { state.month = addMonths(state.month, act === 'prev' ? -1 : 1); state.filter = 'all'; loadEntries(); }
    else if (act === 'toggle-filter') { state.filter = state.filter === 'attention' ? 'all' : 'attention'; loadEntries(); }
    else if (act === 'new') { go('form'); }
    else if (act === 'edit') { openForm(id); }
    else if (act === 'tab') { state.gridType = el.getAttribute('data-type'); renderGrid(); }
    else if (act === 'pick') { selectCategory(id); }
    else if (act === 'back-grid') { closeSheet(); }
    else if (act === 'sheet-dismiss') { dismissSheet(); }
    else if (act === 'assistant-open') { openAssistant(); }
    else if (act === 'assistant-close') { closeAssistant(); }
    else if (act === 'assistant-ask') { askAssistant(id, el.textContent); }
    else if (act === 'table-start') { startTransactionTable(); }
    else if (act === 'table-generate') { generateTransactionTable(); }
    else if (act === 'assistant-goto') {
      closeAssistant();
      if (el.getAttribute('data-action') === 'goto:savings') {
        state.reportTab = 'savings';
        loadReportPage();
        return;
      }
      if (el.getAttribute('data-action') === 'goto:mail_pending') {
        state.meSub = 'gmail';
        loadSettings();
        return;
      }
      // 先问一次有待处理账目的月份，打开最早的；都处理完了就打开本月（显示“没有需要处理的记录”）
      state.filter = 'attention';
      api('api_listMonth', state.boot.current_month, 'attention').then(function (d) {
        var ms = d.attention_months || [];
        state.month = ms.length ? ms[0].month : state.boot.current_month;
        loadEntries();
      }).catch(fail);
    }
    else if (act === 'next-attention') { state.month = el.getAttribute('data-month'); state.filter = 'attention'; loadEntries(); }
    else if (act === 'me-sub') { state.meSub = el.getAttribute('data-sub'); loadSettings(); }
    else if (act === 'toggle-sound') {
      var on = !soundOn(); setSoundOn(on);
      el.classList.toggle('on', on); el.setAttribute('aria-checked', on ? 'true' : 'false');
    }
    else if (act === 'set-lang') { window.I18N.setLang(el.getAttribute('data-lang')); renderSettings(state.deletedCache || []); }
    else if (act === 'me-back') { state.meSub = null; loadSettings(); }
    else if (act === 'me-goto') { state.meSub = el.getAttribute('data-sub'); loadSettings(); }
    else if (act === 'mail-reviewed') {
      api('api_markMailReviewed', id).then(function () { toast('已查看'); return loadSettings(); }).catch(fail);
    }
    else if (act === 'mail-mute') {
      api('api_muteMailSender', id).then(function () { toast('已隐藏这个商家'); return refreshBoot().then(loadSettings); }).catch(fail);
    }
    else if (act === 'mail-auto') {
      var cat = document.getElementById('mail-category-' + id);
      api('api_addMailSenderAndRecord', id, cat ? cat.value : '').then(function () {
        toast('已加入自动名单并记下这笔'); return refreshBoot().then(loadSettings);
      }).catch(fail);
    }
    else if (act === 'mail-record') {
      var pending = ((state.boot && state.boot.gmail && state.boot.gmail.pending) || []).filter(function (m) { return m.id === id; })[0];
      if (!pending) { toast('找不到这封邮件，请刷新后再试'); return; }
      openForm(null).then(function () {
        var d = state.draft;
        d.pending_message_id = id;
        d.amount = typeof pending.amount_cents === 'number' ? centsToText(pending.amount_cents) : '';
        d.merchant = pending.sender_domain || pending.platforms || '';
        d.local_datetime = pending.date_local || state.boot.now_local;
        var cat = (state.boot.categories || []).filter(function (c) { return c.type === 'expense' && !c.archived; })[0];
        d.category_id = cat ? cat.id : '';
        d.note = '来自待查看邮件';
        renderFormPage(); openSheet();
      }).catch(fail);
    }
    else if (act === 'keep-dups') {
      api('api_keepDuplicates', id).then(function () { toast('已保留，两笔都计入'); return refreshBoot().then(loadEntries); }).catch(fail);
    }
    else if (act === 'form-cancel') { show(state.lastPage || 'entries'); }
    else if (act === 'add-tile') { $('addcat-box').hidden = false; $('f-newcat').value = ''; $('f-newcat').focus(); }
    else if (act === 'addcat-cancel') { $('addcat-box').hidden = true; }
    else if (act === 'addcat-ok') { submitNewCategory(); }
    else if (act === 'chip') {
      var d = state.draft, chip = el.getAttribute('data-chip');
      if (chip === 'refund' && d.isManual && !d.is_refund) { d.is_refund = true; d.expanded = 'refund'; }
      else d.expanded = d.expanded === chip ? null : chip;
      renderChips();
    }
    else if (act === 'refund-off') { var dr = state.draft; dr.is_refund = false; dr.refund_of = ''; dr.expanded = null; renderChips(); }
    else if (act === 'key') {
      var dk = state.draft;
      dk.amount = keypadPress(dk.amount, el.getAttribute('data-key'));
      updateAmount();
      showHint('');
    }
    else if (act === 'save') { saveForm(el); }
    else if (act === 'delete') {
      if (!confirm('确定删除这笔账目？30 天内可在“我的 → 最近删除”中恢复。')) return;
      api('api_deleteEntry', id).then(function () { toast('已删除'); return refreshBoot().then(loadEntries); }).catch(fail);
    }
    else if (act === 'restore') {
      api('api_restoreEntry', id).then(function (e) { toast('已恢复'); state.month = e.month_ny; return refreshBoot().then(loadEntries); }).catch(fail);
    }
    else if (act === 'rprev' || act === 'rnext') { loadReport(addMonths(state.reportMonth, act === 'rprev' ? -1 : 1)); }
    else if (act === 'rtab') { state.reportTab = el.getAttribute('data-tab'); loadReportPage(); }
    else if (act === 'savings-refresh') { loadSavings(); }
    else if (act === 'habits-refresh') { loadSpendingHabits(); }
    else if (act === 'savings-goal' || act === 'savings-deposit') { openSavingsEditor(act === 'savings-goal' ? 'goal' : 'deposit', id); }
    else if (act === 'savings-cancel') {
      if (!state.savingsBusy) { state.savingsEditor = null; renderSavings(state.savingsView); }
    }
    else if (act === 'btab') { state.billsTab = el.getAttribute('data-tab'); loadBills(); }
    else if (act === 'yprev' || act === 'ynext') { state.billsYear = String(+state.billsYear + (act === 'yprev' ? -1 : 1)); loadBills(); }
    else if (act === 'bill-month') { loadReport(el.getAttribute('data-month')); }              // 月账单的某个月 → 那个月的月报
    else if (act === 'bill-year') { state.billsTab = 'month'; state.billsYear = el.getAttribute('data-year'); loadBills(); }   // 年账单的某一年 → 那一年的月账单
    else if (act === 'bprev' || act === 'bnext') { loadBudget(addMonths(state.budgetMonth, act === 'bprev' ? -1 : 1)); }
    else if (act === 'budget-edit') { openBudgetEditor(el.getAttribute('data-scope')); }
    else if (act === 'budget-add') { openBudgetPicker(); }
    else if (act === 'bs-pick') { var pc = findCategory(id); state.bedit = { scope: id, name: pc ? pc.name : '', amount: '', mode: 'amount', existing: false }; renderBudgetSheet(); }
    else if (act === 'bs-close') { closeBudgetSheet(); }
    else if (act === 'bkey') {
      if (!state.bedit) return;
      state.bedit.amount = keypadPress(state.bedit.amount, el.getAttribute('data-key'));
      updateBudgetAmount();
      var bh = $('bs-hint'); if (bh) bh.hidden = true;
    }
    else if (act === 'bs-save') { saveBudget(state.bedit && state.bedit.amount); }
    else if (act === 'bs-cancel-budget') { saveBudget(''); }
    else if (act === 'goto-pending') { state.month = el.getAttribute('data-month'); state.filter = 'attention'; loadEntries(); }
    else if (act === 'toggle-sources') {
      var box = el.nextElementSibling; box.hidden = !box.hidden; el.textContent = box.hidden ? '展开来源' : '收起来源';
    }
    else if (act === 'add-cat') {
      var type = el.getAttribute('data-type');
      api('api_addCategory', type, $('new-cat-' + type).value).then(function () { toast('已添加'); loadSettings(); }).catch(fail);
    }
    else if (act === 'del-cat') {
      if (!confirm('删除这个类别？已有账目和月报不受影响。')) return;
      api('api_archiveCategory', id).then(loadSettings).catch(fail);
    }
    else if (act === 'add-src') { api('api_addSource', $('new-src').value).then(function () { toast('已添加'); loadSettings(); }).catch(fail); }
    else if (act === 'del-src') { api('api_archiveSource', id).then(loadSettings).catch(fail); }
  });
  /** 面板里的输入框 / 下拉框：把内容记进草稿（输入框用 input 事件，下拉框用 change 事件，两个都接）。 */
  function onField(ev) {
    var t = ev.target, d = state.draft;
    if (t.id === 'f-near-pct') { if (ev.type === 'change') saveNearPct(t); return; }
    if (!d || !t.id) return;
    if (t.id === 'f-datetime') d.local_datetime = t.value;
    else if (t.id === 'f-merchant') d.merchant = t.value;
    else if (t.id === 'f-note') d.note = t.value;
    else if (t.id === 'f-new-source') d.new_source = t.value;
    else if (t.id === 'f-source') {
      var wasNew = d.source_sel === '__new__';
      d.source_sel = t.value;
      if (wasNew !== (t.value === '__new__')) renderChipPanel();      // 显示/隐藏“新来源名称”
    } else if (t.id === 'f-refund-of') {
      d.refund_of = t.value;
      var opt = t.selectedOptions[0], cat = opt && opt.getAttribute('data-cat');
      if (cat) { d.category_id = cat; renderGrid(); updateSheetHead(); }     // 退款默认使用原交易的类别（PRD 第 4 节）
    } else return;
    updateChipLabels();
  }
  document.addEventListener('input', onField);
  document.addEventListener('change', onField);
  // 文字框获得/失去焦点：自定义键盘隐藏/出现（blur/focus 不冒泡，所以用捕获）
  document.addEventListener('focus', function (ev) { if (isTextField(ev.target)) syncTyping(); }, true);
  document.addEventListener('blur', function (ev) { if (isTextField(ev.target)) { var sh = $('entry-sheet'); if (sh) sh.classList.remove('typing'); $('keypad') && $('keypad').setAttribute('aria-hidden', 'false'); } }, true);
  document.addEventListener('keydown', function (ev) {
    if (ev.key !== 'Enter' || !isTextField(ev.target)) return;
    if (ev.target.closest('.savings-form')) return;
    ev.preventDefault();
    if (ev.target.id === 'f-newcat') submitNewCategory();
    else ev.target.blur();              // 手机键盘的“完成/换行”键 = 收起键盘，自定义键盘回来
  });
  document.addEventListener('touchstart', function () {}, { passive: true });   // 让 iOS 的按键按下效果（:active）生效

  // ---------- 启动 ----------
  refreshBoot().then(function (b) {
    state.month = b.current_month;
    state.reportMonth = b.report_default_month;
    state.budgetMonth = b.current_month;
    return loadEntries();
  }).catch(fail);

  window.__app = { state: state, sound: sound, SAVE_ANIM: SAVE_ANIM, keypadPress: keypadPress, openForm: openForm, donutSlices: donutSlices,
    BUDGET_COLORS: BUDGET_COLORS, DONUT_COLORS: DONUT_COLORS, DONUT_REST: DONUT_REST, catSvg: catSvg };
})();
</script>
